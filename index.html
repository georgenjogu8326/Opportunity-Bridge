

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Opportunity Bridge | Global Opportunities</title>
<meta name="description" content="Discover scholarships, grants, internships, jobs and free online courses from around the world.">
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f5f7fb;color:#172b4d}
header{background:#123b67;color:white;padding:25px 7%}
nav{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:15px}
.logo{font-size:25px;font-weight:bold}
.hero{text-align:center;padding:65px 15px;background:#e5effb}
.hero h1{font-size:38px;margin:0 0 15px}
.hero p{font-size:17px;color:#42566f}
.search{display:flex;max-width:650px;margin:25px auto;gap:10px}
input,select{padding:14px;border:1px solid #d1d9e6;border-radius:8px;font-size:15px}
.search input{flex:1;min-width:0}
button{background:#1769aa;color:white;border:0;padding:13px 20px;border-radius:8px;cursor:pointer}
button:hover{background:#0e4d82}
main{max-width:1100px;margin:35px auto;padding:0 18px}
.filters{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:25px}
.filters select{background:white;flex:1;min-width:180px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px}
.card{background:white;padding:22px;border-radius:12px;box-shadow:0 2px 10px #e1e6ef}
.card h3{margin-top:8px}
.tag{display:inline-block;background:#e5effb;color:#14558b;padding:6px 10px;border-radius:20px;font-size:12px}
.card p{color:#53647a;line-height:1.5}
.card a{display:inline-block;text-decoration:none;background:#1769aa;color:white;padding:11px 15px;border-radius:7px;margin-top:8px}
.empty{background:white;padding:25px;border-radius:10px;text-align:center;grid-column:1/-1}
footer{text-align:center;padding:30px;background:#123b67;color:white;margin-top:60px}
@media(max-width:600px){.hero h1{font-size:29px}.search{flex-direction:column}}
</style>
</head>
<body>
<header>
<nav>
<div class="logo">🌍 Opportunity Bridge</div>
<div>Discover opportunities. Unlock your future.</div>
</nav>
</header>

<section class="hero">
<h1>Find Your Next Opportunity</h1>
<p>Explore scholarships, grants, internships and free courses worldwide.</p>
<div class="search">
<input id="search" type="search" placeholder="Search opportunities...">
<button onclick="showOpportunities()">Search</button>
</div>
</section>

<main>
<h2>Explore Opportunities</h2>
<div class="filters">
<select id="category" onchange="showOpportunities()">
<option value="">All categories</option>
<option>Scholarship</option>
<option>Grant</option>
<option>Internship</option>
<option>Free Course</option>
<option>Job</option>
</select>
<select id="country" onchange="showOpportunities()">
<option value="">All countries</option>
<option>Global</option>
<option>United States</option>
<option>United Kingdom</option>
<option>Kenya</option>
<option>Canada</option>
</select>
</div>
<div id="results" class="cards"></div>
</main>

<footer>
<p>© 2026 Opportunity Bridge. Discover opportunities. Unlock your future.</p>
</footer>

<script>
const opportunities = [
{title:"Explore Global Scholarships",category:"Scholarship",country:"Global",description:"Discover educational funding opportunities around the world.",link:"https://www.scholarshipportal.com/"},
{title:"World Bank Scholarships",category:"Scholarship",country:"Global",description:"Explore scholarship information and education opportunities.",link:"https://www.worldbank.org/en/programs/scholarships"},
{title:"Google Free Courses",category:"Free Course",country:"Global",description:"Develop digital and professional skills through online learning.",link:"https://grow.google/"},
{title:"UN Careers and Internships",category:"Internship",country:"Global",description:"Explore career opportunities and internships with the United Nations.",link:"https://careers.un.org/"},
{title:"Government of Canada Scholarships",category:"Scholarship",country:"Canada",description:"Find information about scholarships for international students.",link:"https://www.educanada.ca/scholarships-bourses/index.aspx?lang=eng"},
{title:"UK Government Scholarships",category:"Scholarship",country:"United Kingdom",description:"Explore UK government scholarship information.",link:"https://www.chevening.org/"},
{title:"Kenya Government Opportunities",category:"Grant",country:"Kenya",description:"Visit the official government website for public information and opportunities.",link:"https://www.mygov.go.ke/"},
{title:"USA Fulbright Program",category:"Scholarship",country:"United States",description:"Explore international educational exchange opportunities.",link:"https://fulbrightprogram.org/"}
];

function showOpportunities(){
const term=document.getElementById("search").value.toLowerCase();
const category=document.getElementById("category").value;
const country=document.getElementById("country").value;
const filtered=opportunities.filter(item=>
(item.title+" "+item.description+" "+item.category+" "+item.country).toLowerCase().includes(term)&&
(!category||item.category===category)&&
(!country||item.country===country||item.country==="Global")
);
const results=document.getElementById("results");
if(!filtered.length){
results.innerHTML='<div class="empty">No matching opportunities found. Try another search.</div>';
return;
}
results.innerHTML=filtered.map(item=>`
<article class="card">
<span class="tag">${item.category}</span>
<h3>${item.title}</h3>
<p><strong>Location:</strong> ${item.country}</p>
<p>${item.description}</p>
<a href="${item.link}" target="_blank" rel="noopener noreferrer">Visit official website ↗</a>
</article>`).join("");
}
showOpportunities();
</script>
</body>
</html>
